services:
  postgres:
    image: postgres:16-alpine
    container_name: zoe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoe
      POSTGRES_PASSWORD: zoe_dev_password
      POSTGRES_DB: zoe_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zoe -d zoe_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local